# Pipeline test configuration - full real-world setup
# Used for: End-to-end pipeline tests with all components

# Output folder for test artifacts
output_folder: ./output/test-pipeline

# Zotero - full configuration with attachments
zotero:
  enabled: true
  data_directory: "C:/Users/colin/Zotero"
  extract_attachments: true # Enable PDF extraction for full tests
  include_notes: true
  include_annotations: false
  max_extraction_threads: 4

# Obsidian - full vault configuration
obsidian:
  enabled: true
  vault_path: "C:/Users/colin/OneDrive/Documents/Vaults/PhD Vault"
  include_folders:
    - "fleeting"
    - "LitNotes"
    - "Concepts"
  exclude_folders:
    - "Templates"
    - ".obsidian"
    - ".trash"

# Embedding configuration
embedding:
  model: "text-embedding-bge-m3"
  api_endpoint: "http://localhost:1234/v1"
  api_key: "sk-lm-nNiGKWlr:2CgOVIJlX5UcGyf3UKR6"
  batch_size: 10

# ChromaDB vector storage configuration
storage:
  type: "chroma"
  endpoint: "http://localhost:8000"
  collection_name: "test_pipeline"
  distance_metric: "cosine"

# Text chunking configuration
chunking:
  mode: legacy_router
  chunk_size: 512
  chunk_overlap: 64
  strategy: "recursive"

  # Router config
  router_enabled: true
  id_strategy: stable_hash
  debug_router: true  # Enable router debug output

  defaults:
    strategy: recursive
    chunk_size: 2048
    chunk_overlap: 256

  markdown:
    enabled: true
    header_levels: [1, 2, 3]
    max_section_tokens: 900

  huge_docs:
    enabled: true
    huge_doc_tokens: 4000  # LOWERED for testing (production uses 25000)
    levels:
      coarse: { chunk_size: 2200, chunk_overlap: 200 }
      mid:    { chunk_size: 700,  chunk_overlap: 100 }
      fine:   { chunk_size: 220,  chunk_overlap: 40 }

# Indexing configuration
indexing:
  batch_size: 50
