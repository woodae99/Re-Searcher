# Pipeline test configuration - full real-world setup
# Used for: End-to-end pipeline tests with all components

# Output folder for test artifacts
output_folder: ./output/test-pipeline

# Zotero - full configuration with attachments
zotero:
  enabled: true
  data_directory: "C:/Users/colin/Zotero"
  extract_attachments: true # Enable PDF extraction for full tests
  include_notes: true
  include_annotations: false
  max_extraction_threads: 4

# Obsidian - full vault configuration
obsidian:
  enabled: true
  vault_path: "C:/Users/colin/OneDrive/Documents/Vaults/PhD Vault"
  include_folders:
    - "fleeting"
    - "LitNotes"
    - "Concepts"
  exclude_folders:
    - "Templates"
    - ".obsidian"
    - ".trash"

# Embedding configuration
embedding:
  model: "text-embedding-bge-m3"
  api_endpoint: "http://localhost:1234/v1"
  api_key: "sk-lm-nNiGKWlr:2CgOVIJlX5UcGyf3UKR6"
  batch_size: 10

# ChromaDB vector storage configuration
storage:
  type: "chroma"
  endpoint: "http://localhost:8000"
  collection_name: "test_pipeline"
  distance_metric: "cosine"

# Text chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 64
  strategy: "recursive"

# Indexing configuration
indexing:
  batch_size: 50
