[pytest]
# Pytest configuration for Re-Searcher tests

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires Zotero/Obsidian)
    pipeline: End-to-end pipeline tests (full workflow)
    slow: Slow tests (takes > 1 minute)
    requires_chromadb: Test requires ChromaDB connection
    requires_lmstudio: Test requires LM Studio connection

# Test paths
testpaths = tests

# Coverage
[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
