# research-rag configuration
# Copy this to config.yaml and update paths for your system

# Zotero configuration
zotero:
  enabled: true
  # API type: 'local' for local SQLite access, 'web' for Zotero Web API
  api_type: local
  # Port for local Zotero connector (if using local API)
  local_port: 23119
  # Path to Zotero data directory
  # Windows: C:\Users\<YourUser>\Zotero
  # macOS: /Users/<YourUser>/Zotero
  # Linux: /home/<YourUser>/Zotero
  data_directory: ""
  # Whether to extract text from PDF attachments
  extract_attachments: true
  # Whether to include notes
  include_notes: true
  # Whether to include annotations
  include_annotations: true

# Obsidian vault configuration
obsidian:
  enabled: false
  # Path to your Obsidian vault
  # Windows: C:\Users\<YourUser>\Documents\ObsidianVault
  # macOS: /Users/<YourUser>/Documents/ObsidianVault
  # Linux: /home/<YourUser>/Documents/ObsidianVault
  vault_path: ""
  # Folders to include (leave empty for all)
  include_folders:
    - "LitNotes"
    - "Concepts"
  # Folders to exclude
  exclude_folders:
    - "Templates"
    - ".obsidian"

# Local file sources (for backward compatibility)
local_files:
  enabled: false
  input_folder: ""
  file_types:
    - .pdf
    - .md
    - .epub
    - .docx
    - .html
    - .htm

# Embedding model configuration
embedding:
  # Provider: 'lmstudio' or 'openai'
  provider: lmstudio
  # LM Studio endpoint (OpenAI-compatible API)
  endpoint: "http://localhost:1234/v1"
  # Model name for LM Studio
  model: "text-embedding-bge-m3"
  # Batch size for embedding requests
  batch_size: 32
  # Timeout for API requests (seconds)
  timeout: 30
  # Model context length (for oversize guard calculations)
  context_length: 8192  # BGE-M3 context window
  # Provider-specific settings (preferred)
  lmstudio:
    base_url: "http://localhost:1234/v1"
    model: "text-embedding-model-name"
    timeout_seconds: 120
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: null
    model: "text-embedding-3-large"
    timeout_seconds: 60

# Vector storage configuration
storage:
  # Provider: 'chroma' or 'faiss' (for backward compatibility)
  provider: chroma
  # ChromaDB endpoint
  endpoint: "http://localhost:8000"
  # Collection name for storing embeddings
  collection_name: "research_library"
  # Distance metric: 'cosine', 'l2', or 'ip' (inner product)
  distance_metric: cosine

# Extraction configuration (parallel PDF extraction)
extraction:
  # Enable parallel extraction for better throughput
  parallel: true
  # Number of workers: "auto" = os.cpu_count(), or explicit int
  workers: auto
  # Execution mode: 'thread' (recommended) or 'process'
  mode: thread

# Text chunking configuration
chunking:
  # Chunk size in characters
  chunk_size: 2048
  # Overlap between chunks
  chunk_overlap: 256
  # Chunking strategy: 'character', 'token', or 'semantic'
  strategy: character
  # New router configuration (vNext)
  router_enabled: true
  id_strategy: stable_hash  # stable_hash | legacy
  # Oversize guard settings (prevents embedder truncation)
  max_tokens_per_chunk: 7000     # Leave margin for 8192 context
  oversize_policy: split         # split | truncate | skip
  token_estimator: heuristic     # heuristic | model_tokenizer
  defaults:
    strategy: recursive
    chunk_size: 2048
    chunk_overlap: 256
  markdown:
    enabled: true
    header_levels: [1, 2, 3]
    max_section_tokens: 900
  huge_docs:
    enabled: true
    huge_doc_tokens: 25000
    levels:
      coarse: { chunk_size: 2200, chunk_overlap: 200 }
      mid:    { chunk_size: 700,  chunk_overlap: 100 }
      fine:   { chunk_size: 220,  chunk_overlap: 40 }

retrieval:
  k_recall: 50
  rerank:
    enabled: true
    type: llm  # none | llm | cross_encoder
    top_n: 8
    llm:
      provider: lmstudio  # lmstudio | openai
      model: null
      max_tokens: 256
      temperature: 0.0
  expand:
    include_parent: true
    max_parents: 1

# Output configuration
output_folder: ./output
log_progress: true

# Optional: Ontology expansion (from original Re-Searcher)
ontology_file: ""
