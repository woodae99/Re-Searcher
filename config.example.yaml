# research-rag configuration
# Copy this to config.yaml and update paths for your system

# Zotero configuration
zotero:
  enabled: true
  # API type: 'local' for local SQLite access, 'web' for Zotero Web API
  api_type: local
  # Port for local Zotero connector (if using local API)
  local_port: 23119
  # Path to Zotero data directory
  # Windows: C:\Users\<YourUser>\Zotero
  # macOS: /Users/<YourUser>/Zotero
  # Linux: /home/<YourUser>/Zotero
  data_directory: ""
  # Whether to extract text from PDF attachments
  extract_attachments: true
  # Whether to include notes
  include_notes: true
  # Whether to include annotations
  include_annotations: true
  # Local API base for incremental change detection and indexed fulltext retrieval
  local_api_base: "http://localhost:23119/api/users/0"
  local_api_timeout: 20
  # Prefer Zotero indexed fulltext for attachments before fallback extraction
  prefer_local_api_fulltext: true
  # Ignore tiny fulltext payloads
  fulltext_min_chars: 200
  # Heuristic: large PDFs with tiny indexed fulltext are likely partial-indexed
  fulltext_large_pdf_mb: 20
  fulltext_large_pdf_min_chars: 20000
  # Set true to scan /fulltext?since=0 on first delta bootstrap (can be very slow on large libraries)
  fulltext_bootstrap_scan: false

# Obsidian vault configuration
obsidian:
  enabled: false
  # Path to your Obsidian vault
  # Windows: C:\Users\<YourUser>\Documents\ObsidianVault
  # macOS: /Users/<YourUser>/Documents/ObsidianVault
  # Linux: /home/<YourUser>/Documents/ObsidianVault
  vault_path: ""
  # Folders to include (leave empty for all)
  include_folders:
    - "LitNotes"
    - "Concepts"
  # Folders to exclude
  exclude_folders:
    - "Templates"
    - ".obsidian"
  # Also exclude paths from .obsidian/app.json userIgnoreFilters
  use_obsidian_ignore_filters: false

# Local file sources (for backward compatibility)
local_files:
  enabled: false
  input_folder: ""
  file_types:
    - .pdf
    - .md
    - .epub
    - .docx
    - .html
    - .htm

# Embedding model configuration
embedding:
  # Provider: 'vllm' (production), 'lmstudio' (interactive/graphical), or 'openai'.
  # v0.6 production backend is vLLM serving Qwen3-Embedding-0.6B — ~6x LM Studio's
  # embedding throughput. See docs/EMBEDDER_BAKEOFF.md and docs/EMBEDDING_BACKEND.md.
  provider: vllm
  # Model identifier (vLLM loads from HuggingFace; LM Studio uses its catalog id).
  model: "Qwen/Qwen3-Embedding-0.6B"
  # Asymmetric query instruction. Qwen3-Embedding expects this on QUERIES only;
  # documents are embedded raw. Required to realise Qwen3's retrieval-quality edge.
  # Leave empty ("") for symmetric embedders like bge-m3.
  query_instruction: "Instruct: Given a research question, retrieve passages that answer it\nQuery:"
  # Batch size for embedding requests (vLLM batches efficiently; 128 is a good default).
  batch_size: 128
  # Maximum parallel embedding API requests.
  max_concurrent_requests: 8
  # Timeout for API requests (seconds).
  timeout: 120
  # Model context length. MUST exceed chunking.max_tokens_per_chunk (the oversize
  # guard) — Markdown chunks (conversation logs / tables with no paragraph breaks) can
  # be large, and a batch with ANY over-context chunk fails entirely (fail-loud embed).
  # On vLLM a larger window costs little (token-batched); on llama.cpp it's slower.
  context_length: 8192
  # --- vLLM backend (OpenAI-compatible) + managed lifecycle -------------------
  vllm:
    base_url: "http://localhost:8002/v1"
    model: "Qwen/Qwen3-Embedding-0.6B"
    # Managed lifecycle: bulk jobs (index/reindex) auto stand-up/stand-down the
    # container; `scripts/vllm_service.py start` runs a persistent one for retrieval.
    managed:
      enabled: true
      image: "vllm/vllm-openai:v0.20.0"
      container_name: "researcher-vllm-embed"
      port: 8002
      gpus: "all"
      runner: "pooling"           # vLLM's embedding/pooling runner
      max_model_len: 8192         # must exceed chunking.max_tokens_per_chunk (7000)
      gpu_memory_utilization: 0.3
      hf_cache: "~/.cache/huggingface"
      startup_timeout: 900        # first run downloads weights + compiles
      keep_up: false              # bulk jobs tear down; the service command keeps up
      extra_args: []              # any additional `vllm serve` flags
  # --- LM Studio (interactive/graphical alternative) --------------------------
  lmstudio:
    base_url: "http://localhost:1234/v1"
    model: "text-embedding-bge-m3"
    batch_size: 128
    max_concurrent_requests: 2
    timeout_seconds: 120
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: null
    model: "text-embedding-3-large"
    timeout_seconds: 60

# Vector storage configuration
storage:
  # Provider: 'chroma' or 'faiss' (for backward compatibility)
  provider: chroma
  # ChromaDB endpoint
  endpoint: "http://localhost:8000"
  # Collection name for storing embeddings
  collection_name: "research_library"
  # Distance metric: 'cosine', 'l2', or 'ip' (inner product)
  distance_metric: cosine

# Extraction configuration (parallel PDF extraction)
extraction:
  # Enable parallel extraction for better throughput
  parallel: true
  # Number of workers: "auto" = os.cpu_count(), or explicit int
  workers: auto
  # Execution mode: 'thread' (recommended) or 'process'
  mode: thread
  router:
    # v0.6 PDF/fulltext seam. Zotero FT cache is tried first, then pdfminer.
    # Candidate text is quality-scored; recoverable noise is deterministically
    # cleaned and re-scored; unresolved failures are recorded as provenance.
    enabled: true
    pdfminer_timeout_seconds: 60
    # Marker/OCR remains an opt-in expensive escalation backstop.
    marker_enabled: false

# Text chunking configuration
chunking:
  # v0.6 production mode: a single retrieval grain in Chroma.
  # - Zotero/fulltext/default text -> recursive mid chunks
  # - Zotero annotations -> atomic chunks
  # - Obsidian markdown -> mid chunks with heading_path
  # Legacy hierarchy remains available only by setting mode: legacy_router.
  mode: v0.6_single_grain  # v0.6_single_grain | legacy_router
  # v0.6 working grain — recursive 700/100, settled by measured retrieval evals.
  # 'recursive' decisively beats 'character' (which only splits on blank lines and
  # so can't break over-long paragraphs); size 700/100 wins on passage-retrieval
  # quality through the production rerank stage while staying lean to read.
  # See docs/CHUNKING_EVAL.md (source-level) and docs/PASSAGE_EVAL.md (passage+rerank).
  # Chunk size in characters
  chunk_size: 700
  # Overlap between chunks
  chunk_overlap: 100
  # Chunking strategy: 'character' | 'recursive' | 'token' | 'semantic'
  strategy: recursive
  # Router configuration. In v0.6_single_grain mode, this router never routes
  # huge documents to the legacy hierarchical chunker.
  router_enabled: true
  id_strategy: stable_hash  # stable_hash | legacy
  # Oversize guard settings (prevents embedder truncation)
  max_tokens_per_chunk: 7000     # Leave margin for 8192 context
  oversize_policy: split         # split | truncate | skip
  token_estimator: heuristic     # heuristic | model_tokenizer
  quality_filter:
    enabled: false
    dry_run: false
    min_alnum_chars: 40
    min_alnum_ratio: 0.20
    max_whitespace_ratio: 0.85
    min_token_est: 20
    min_unique_char_ratio: 0.08
    max_line_repeat_ratio: 0.30
    drop_if_matches:
      - "^[0-9]{1,3}$"
      - "^\\*{3,}$"
      - "^(SUMMARY|ABSTRACT|CONTENTS)$"
    keep_if_metadata_present:
      - "heading_path"
      - "zotero_key"
    skip_source_types:
      - "obsidian"
    whitelist_source_ids: []
    blacklist_source_ids: []
    report:
      enabled: true
      top_n: 50
      output_path: "runs/{RUN_ID}/quality_report.json"
  defaults:                # used by the flat TextChunker (e.g. Zotero PDF fulltext)
    strategy: recursive
    chunk_size: 700        # v0.6 working grain — see docs/PASSAGE_EVAL.md
    chunk_overlap: 100
  markdown:
    enabled: true
    header_levels: [1, 2, 3]
    max_section_tokens: 900
  # Legacy/experimental hierarchy settings. These are ignored unless
  # chunking.mode is legacy_router.
  huge_docs:
    enabled: false
    huge_doc_tokens: 25000
    levels:
      coarse: { chunk_size: 2200, chunk_overlap: 200 }
      mid:    { chunk_size: 700,  chunk_overlap: 100 }   # validated working grain (PASSAGE_EVAL.md)
      fine:   { chunk_size: 220,  chunk_overlap: 40 }

retrieval:
  k_recall: 50
  mode_default: fast  # fast | strict
  telemetry:
    enabled: true
  rerank:
    enabled: true
    # none | llm | cross_encoder. v0.6 production runtime is 'cross_encoder' served
    # by vLLM's native /rerank — fast, no LLM JSON to parse. See docs/EMBEDDING_BACKEND.md.
    type: cross_encoder
    # If set, limit reranked list before final k-return slice.
    top_n: 8
    # Bound reranker input (applies to both reranker types).
    max_candidates: 30
    max_chars_per_candidate: 1200
    # --- cross-encoder reranker via vLLM /rerank (production) ----------------
    cross_encoder:
      base_url: "http://localhost:8005/v1"
      model: "BAAI/bge-reranker-v2-m3"   # or Qwen3-Reranker-0.6B (matched to the embedder)
      timeout_seconds: 60
      managed:                            # own vLLM container, same lifecycle pattern
        enabled: true
        image: "vllm/vllm-openai:v0.20.0"
        container_name: "researcher-vllm-rerank"
        port: 8005
        gpus: "all"
        runner: "pooling"                 # cross-encoders are pooling/scoring models
        max_model_len: 1024
        gpu_memory_utilization: 0.25
        hf_cache: "~/.cache/huggingface"
        startup_timeout: 900
        keep_up: false
    # --- LLM reranker (alternative; LM Studio or OpenAI) ---------------------
    llm:
      provider: lmstudio  # lmstudio | openai
      model: ibm/granite-4-micro
      max_tokens: 512
      temperature: 0.0
  diversity:
    enabled: true
    # Grouping key preference for limiting repeats.
    # source_id is added during indexing; zotero_key/title are fallbacks.
    key_priority: ["source_id", "zotero_key", "title"]
    max_per_key: 2
  expand:
    include_parent: true
    max_parents: 1

# Output configuration
output_folder: ./output
log_progress: true

# Structured per-run event stream for long indexing jobs. Events are written to
# <output_folder>/runs/<run_id>/events.jsonl, with a compact summary at the end.
run_reporting:
  enabled: true
  events_file: "events.jsonl"
  summary_file: "summary.json"

# Indexing configuration
indexing:
  # Documents per batch for resumable indexing
  batch_size: 50
  dashboard:
    enabled: true
    snapshot_file: "indexing_dashboard.json"
    snapshot_interval_seconds: 1.0
  stop_after_batch:
    flag_file: "stop_after_batch.flag"
  delta:
    enabled: true
    state_file: "zotero_delta_state.json"
    # Changed/deleted items have their old chunks removed in batches of this
    # size before re-indexing. There is no upper limit on keys per run.
    delete_batch_size: 100
  ledger:
    # Behavior-changing P3 path: execute updates from the register-ledger
    # work plan instead of the legacy Zotero sidecar / vault snapshot delta.
    # Kept OFF until shadow parity (below) is confirmed on a real run; flip to
    # true at the chapter-4 cutover, then retire the sidecar. Matches code default.
    execute: false
    # P2 parity gate: compute the register-ledger work plan and log it beside
    # the current delta path, without letting it drive execution yet.
    shadow: true
  # Optional: pipeline embed/store overlap to reduce idle time
  embed_store_pipeline:
    enabled: false
    queue_max_items: 8
    embed_sub_batch_size: 500
    store_sub_batch_size: 500

# Optional: Ontology expansion (from original Re-Searcher)
ontology_file: ""
